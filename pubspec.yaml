name: dimension
description: >-
  A Flutter package that introduce the Dimension class.
  It mimics the css length unit and supports units
  like px, percentage, vw, vh, vmin ,and vmax.
version: 0.2.1
repository: https://github.com/KevinVan720/dimension

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_class_parser: ^0.2.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
